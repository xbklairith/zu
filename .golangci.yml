linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - misspell
    - revive
    - gosec
issues:
  exclude-rules:
    # Writes to the CLI's stdout/stderr have no meaningful recovery.
    - linters: [errcheck]
      source: "fmt\\.Fprint"
    # Tests create fixtures in t.TempDir() and run git with test-chosen args.
    - linters: [gosec]
      path: _test\.go
